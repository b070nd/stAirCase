# .goreleaser.yml — stAirCase release configuration
# Run: goreleaser release --clean
# Or:  goreleaser build --snapshot --clean (local test build)
version: 2

project_name: staircase

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: staircase
    main: ./src/cmd/staircase
    binary: staircase
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: staircase
    name_template: "staircase_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README-v1.md

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: b070nd
    name: staircase-core
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
