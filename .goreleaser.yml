# .goreleaser.yml — stAirCase release configuration
# Run: goreleaser release --clean
# Or:  goreleaser build --snapshot --clean (local test build)
version: 2

project_name: staircase

# No before-hooks: CI enforces `go mod tidy -diff`, and nothing uses go:generate.

builds:
  - id: staircase
    main: ./src/cmd/staircase
    binary: staircase
    env:
      - CGO_ENABLED=0
    # Windows (amd64) ships as experimental: make check cross-builds it, but it
    # is not run in CI, and run_shell / --agent claude-code need a POSIX shell.
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: staircase
    name_template: "staircase_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# SBOM generation (requires syft in PATH on the release runner).
# Produces one SPDX JSON file per release archive for supply-chain provenance.
# Install syft in CI via: anchore/sbom-action/download-syft before goreleaser step.
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"

# Keyless (Sigstore OIDC) signing of the checksum file. Verifying the signed
# checksums transitively verifies every archive. Requires cosign in PATH and
# an OIDC token (id-token: write) on the release job. Skipped in snapshot builds.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: b070nd
    name: stAirCase
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
