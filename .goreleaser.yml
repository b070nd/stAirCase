# .goreleaser.yml — stAirCase release configuration
# Run: goreleaser release --clean
# Or:  goreleaser build --snapshot --clean (local test build)
version: 2

project_name: staircase

before:
  hooks:
    - ./packaging/completions.sh # bash/zsh/fish completions for the archives

builds:
  - id: staircase
    main: ./src/cmd/staircase
    binary: staircase
    env:
      - CGO_ENABLED=0
    # Reproducible: no local paths, file times and build date from the commit.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Windows (amd64) ships as experimental: make check cross-builds it, but it
    # is not run in CI, and run_shell / --agent claude-code need a POSIX shell.
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}

archives:
  - id: staircase
    name_template: "staircase_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # File times from the commit, so archives are byte-reproducible too.
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &commit_mtime
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info: *commit_mtime
      - src: CHANGELOG.md
        info: *commit_mtime
      - src: completions/*
        info: *commit_mtime

checksum:
  name_template: "checksums.txt"

# SBOM generation (requires syft in PATH on the release runner).
# Produces one SPDX JSON file per release archive for supply-chain provenance.
# Install syft in CI via: anchore/sbom-action/download-syft before goreleaser step.
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"

# Keyless (Sigstore OIDC) signing of the checksum file into one Sigstore bundle
# (signature, certificate and transparency-log proof), the format cosign 3
# writes. Verifying the signed checksums transitively verifies every archive.
# Requires cosign in PATH and an OIDC token (id-token: write) on the release
# job. Skipped in snapshot builds.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: b070nd
    name: stAirCase
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
