name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Effect on the safety boundary
      description: stAirCase is a control plane. Does this change what an agent can do without an approval, or what the audit chain proves?
