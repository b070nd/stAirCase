name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gate tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          if [ "$RUNNER_OS" = "macOS" ]; then brew install bats-core; else sudo apt-get install -y bats; fi

      # The single gate: lint, gofmt, tidy, the Windows build, full + race tests,
      # bats CLI smoke tests, and the offline demo.
      - name: make check
        if: runner.os != 'Linux'
        run: ./packaging/test-report.sh make check
        env:
          STAIRCASE_REQUIRE_SANDBOX: sandbox-exec
          # the programs the tests drive (ssh-keygen, node, python3): missing is a failure, not a skip
          STAIRCASE_REQUIRE_DEPS: "1"

      # On Linux the gate is the release evidence: make check, a count of every Go test, the
      # kill drills, the independent conformance scripts (a specification-only implementation
      # must decide the vectors as stAirCase does), the packaged verifier on a fresh mirror and
      # the vulnerability scan, with a machine-readable record tied to this commit.
      - name: Install the vulnerability scanner
        if: runner.os == 'Linux'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Release evidence (make check and the rest)
        if: runner.os == 'Linux'
        run: ./packaging/test-report.sh make evidence
        env:
          STAIRCASE_REQUIRE_SANDBOX: landlock

      # evidence.json and the conformance results hold no path, environment value or log text.
      # The step logs are not uploaded: they are raw output.
      - name: Keep the evidence record
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evidence-linux-${{ github.sha }}
          path: |
            evidence/evidence.json
            evidence/*_vectors.json
          if-no-files-found: error
