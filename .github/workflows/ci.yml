name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["stable"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Test (unit + conformance + audit checks)
        run: CGO_ENABLED=0 make test-ci

      - name: Race detector
        if: matrix.os != 'windows-latest'
        run: go test -race ./src/internal/... -count=1 -short

      - name: Vulnerability scan
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  demo:
    name: Offline demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: "stable"
          cache: true

      - name: Run the offline demo (happy path + tamper path)
        run: make demo
