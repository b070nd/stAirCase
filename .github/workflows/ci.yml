name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gate tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          if [ "$RUNNER_OS" = "macOS" ]; then brew install bats-core; else sudo apt-get install -y bats; fi

      # The single gate: lint, gofmt, tidy, the Windows build, full + race tests,
      # bats CLI smoke tests, and the offline demo.
      - name: make check
        run: make check
        env:
          # the OS sandbox engines that must be tested here, not skipped
          STAIRCASE_REQUIRE_SANDBOX: ${{ runner.os == 'Linux' && 'landlock' || 'sandbox-exec' }}

      # An implementation written from docs/spec alone must decide the
      # certificate's conformance vectors as stAirCase does.
      - name: Certificate vectors (independent verifier)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv /tmp/spec
          /tmp/spec/bin/pip install -q cryptography==50.0.1
          /tmp/spec/bin/python docs/spec/verify_vectors.py

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
