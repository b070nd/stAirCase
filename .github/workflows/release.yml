name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write     # create the release
  id-token: write     # cosign keyless signing and build provenance (Sigstore OIDC)
  attestations: write # GitHub artifact attestations

jobs:
  # A tag is not proof of a green build. Release only a commit on the default
  # branch for which the CI workflow (make check, vectors, vulnerability scan)
  # succeeded.
  gate:
    name: CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a successful CI run on this commit
        run: ./packaging/release-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}

  goreleaser:
    name: GoReleaser
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run tests
        run: CGO_ENABLED=0 ./packaging/test-report.sh go test ./...

      - name: Install syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Install cosign (for keyless artifact signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Release notes from CHANGELOG.md
        run: ./packaging/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
