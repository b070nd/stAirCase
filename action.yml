name: stAirCase verify
description: Require a valid change certificate on every commit an AI agent helped make
author: b070nd
branding:
  icon: shield
  color: green

inputs:
  key:
    description: Path of the trusted public signing key (a workspace's .signing.pub) in the repository. Read from the pull request's base branch (or trust-ref), never from the pull request itself
    required: true
  allowed-signers:
    description: Path of the git allowed_signers file of trusted reviewers (CAL 4), read from the same trusted ref as the key
    default: ""
  require-initiator:
    description: '"true": CAL 4 counts only when the run''s initiator signed the request and is in allowed-signers'
    default: "false"
  trust-ref:
    description: Git ref the key and allowed-signers are read from. Default for a pull request is origin/<base branch>; outside one, set it to a protected branch or tag
    default: ""
  rebuild:
    description: '"true": also rebuild each commit from its ledger (refs/notes/staircase-ledger) and require the same tree'
    default: "false"
  min-cal:
    description: Lowest change assurance level accepted (1-4)
    default: "2"
  all:
    description: '"true" (default): every commit in the range needs a certificate. "false" skips commits that name no agent, which an agent commit can dodge by omitting its Assisted-by trailer'
    default: "true"
  range:
    description: Commit range to check; default for a pull request is origin/<base>..<head>
    default: ""
  version:
    description: staircase release to use (vX.Y.Z); default is the version of this action, else the latest release
    default: ""

runs:
  using: composite
  steps:
    - name: Verify change certificates
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        MIN_CAL: ${{ inputs.min-cal }}
        ALL: ${{ inputs.all }}
        ALLOWED_SIGNERS: ${{ inputs.allowed-signers }}
        TRUST_REF: ${{ inputs.trust-ref }}
        REBUILD: ${{ inputs.rebuild }}
        REQUIRE_INITIATOR: ${{ inputs.require-initiator }}
        RANGE: ${{ inputs.range }}
        VERSION: ${{ inputs.version || github.action_ref }}
        BASE_REF: ${{ github.base_ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ github.token }}
      run: '"$GITHUB_ACTION_PATH/packaging/verify-action.sh"'
