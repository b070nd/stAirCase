version: "2"

# The default linters (errcheck, govet, ineffassign, staticcheck, unused) plus the ones below, which catch real mistakes:
# errors compared or asserted without errors.Is/As, errors formatted without %w, appends that share a backing array, os.Exit after a
# defer, misspellings, needless conversions, shadowed built-in names and magic HTTP status numbers.
# Left off on purpose: gosec and revive (mostly style and false positives for a tool that runs git and reads files by design),
# nilerr (the walks skip unreadable entries on purpose).

linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - predeclared
    - unconvert
    - usestdlibvars
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain # a long if-else chain is sometimes the clearer shape
  exclusions:
    rules:
      # Test files: t.Cleanup(func(){x.Close()}), defer Body.Close(), seed helpers -
      # all idiomatic Go; errors are always nil in unit-test contexts.
      - path: "_test\\.go"
        linters:
          - errcheck

      # sql.DB.Close / sql.Rows.Close: errors here are always nil in practice
      # (they flush or close a pooled connection); no meaningful recovery exists.
      - linters: [errcheck]
        text: "Error return value of `(db|rows)\\.Close` is not checked"

      # fmt.Fprintln / fmt.Fprintf to os.Stdout in CLI commands: writing to a
      # local terminal cannot fail in a meaningful way; suppressing is idiomatic.
      - linters: [errcheck]
        text: "Error return value of `fmt\\.Fprint"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
